<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caisse Naange</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: a clickable prototype of the caisse as an installed app — tablet shell (step rail + content) or phone shell (bottom step bar); one deliberate light look, like the POS itself. */
  :root {
    --bg: #f7f6f3; --card: #ffffff; --ink: #18181b; --sub: #6f6f78; --line: #e7e5e0; --fill: #f1efea;
    --amber: #f59e0b; --amber-2: #d97706; --amber-3: #b45309; --amber-soft: #fff4dc; --amber-ink: #8a4b04;
    --green: #0E7A34; --green-soft: #e5f3ea; --red: #c9372c; --red-soft: #fdecea;
    --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--font); background: #2b2a27; color: var(--ink); -webkit-font-smoothing: antialiased; touch-action: manipulation; overscroll-behavior: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  .i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; width: 22px; height: 22px; flex-shrink: 0; }
  .i16 { width: 16px; height: 16px; } .i18 { width: 18px; height: 18px; } .i28 { width: 28px; height: 28px; } .i40 { width: 40px; height: 40px; }
  .num { font-variant-numeric: tabular-nums; }
  .sub { color: var(--sub); font-size: 13px; }

  /* ---------- host: full screen, or a phone frame for review on a computer ---------- */
  #host { height: 100%; display: flex; align-items: center; justify-content: center; }
  .app { position: relative; width: 100%; height: 100%; background: var(--bg); overflow: hidden; user-select: none; -webkit-user-select: none; }
  #host.framed { padding: 20px; }
  #host.framed .device { width: 410px; height: 864px; padding: 10px; border-radius: 52px; background: #0d0d0c; box-shadow: 0 30px 60px -20px rgb(0 0 0 / 0.6); transform-origin: center; flex-shrink: 0; }
  #host.framed .app { border-radius: 42px; }

  /* ---------- tablet shell ---------- */
  .t-shell { display: grid; grid-template-columns: 112px 1fr; height: 100%; }
  .rail { background: linear-gradient(180deg, var(--amber), var(--amber-2)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: calc(12px + env(safe-area-inset-top, 0px)) 10px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(10px, env(safe-area-inset-left, 0px)); }
  .rail .logo { width: 64px; height: 64px; border-radius: 18px; background: #fff; color: var(--green); font-weight: 800; font-size: 13px; line-height: 1.05; display: flex; align-items: center; justify-content: center; text-align: center; margin-bottom: 6px; box-shadow: 0 6px 14px -8px rgb(0 0 0 / 0.4); }
  .step { position: relative; width: 92px; min-height: 70px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #fff; font-size: 12px; font-weight: 600; transition: background 0.15s, transform 0.1s; }
  .step:active { transform: scale(0.96); }
  .step.on { background: #fff; color: var(--amber-3); box-shadow: 0 8px 18px -10px rgb(120 60 0 / 0.7); }
  .step .done { position: absolute; top: 6px; right: 8px; width: 18px; height: 18px; border-radius: 99px; background: rgb(255 255 255 / 0.95); color: var(--green); display: flex; align-items: center; justify-content: center; }
  .step.on .done { background: var(--green-soft); }
  .rail .grow { flex: 1; }
  .rail-client { width: 92px; border-radius: 16px; background: rgb(255 255 255 / 0.16); color: #fff; padding: 10px 8px; text-align: center; font-size: 12px; }
  .rail-client b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail-client button { margin-top: 6px; width: 100%; height: 34px; border-radius: 10px; background: rgb(255 255 255 / 0.22); font-weight: 600; font-size: 12px; }
  .hub { width: 92px; height: 48px; border-radius: 14px; background: rgb(120 53 15 / 0.35); color: #fff; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .t-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 10px 24px; background: var(--bg); }
  .topbar h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
  .topbar .lede { margin: 2px 0 0; color: var(--sub); font-size: 14px; }
  .ctn { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); text-align: left; max-width: 100%; }
  .ctn .lbl { font-size: 11px; color: var(--sub); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; display: block; }
  .ctn b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .content { flex: 1; min-height: 0; overflow: auto; padding: 8px max(24px, env(safe-area-inset-right, 0px)) 24px 24px; -webkit-overflow-scrolling: touch; }
  .enter { animation: enter 0.22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

  /* ---------- phone shell ---------- */
  .p-shell { display: flex; flex-direction: column; height: 100%; }
  .p-top { padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); }
  .framed .p-top { padding-top: 54px; }
  .p-top .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .p-top h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-top .ctn { height: 40px; border-radius: 12px; margin-top: 8px; }
  .avatar-btn { width: 44px; height: 44px; border-radius: 99px; background: var(--amber-soft); color: var(--amber-ink); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .p-content { flex: 1; min-height: 0; overflow: auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
  .p-nav { display: grid; grid-template-columns: repeat(6, 1fr); background: rgb(255 255 255 / 0.96); border-top: 1px solid var(--line); padding: 6px max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
  .framed .p-nav { padding-bottom: 26px; }
  .p-nav button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; min-height: 52px; font-size: 10.5px; font-weight: 600; color: var(--sub); }
  .p-nav button .ic { width: 52px; height: 30px; border-radius: 99px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .p-nav button.on { color: var(--amber-3); } .p-nav button.on .ic { background: var(--amber-soft); }
  .p-nav .done { position: absolute; top: 2px; right: calc(50% - 22px); width: 14px; height: 14px; border-radius: 99px; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; }

  /* ---------- shared pieces ---------- */
  .card { background: var(--card); border-radius: 20px; box-shadow: 0 1px 2px rgb(0 0 0 / 0.04), inset 0 0 0 1px var(--line); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 20px; border-radius: 16px; font-weight: 600; font-size: 16px; background: var(--fill); color: var(--ink); white-space: nowrap; transition: transform 0.08s, filter 0.15s; }
  .btn:active { transform: scale(0.97); filter: brightness(0.95); }
  .btn.p { background: var(--amber); color: #fff; box-shadow: 0 10px 20px -12px rgb(217 119 6 / 0.9); }
  .btn.g { background: var(--green); color: #fff; box-shadow: 0 10px 20px -12px rgb(14 122 52 / 0.9); }
  .btn.out { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.ghost { background: transparent; color: var(--amber-3); }
  .btn.xl { height: 60px; font-size: 18px; border-radius: 18px; }
  .btn.block { width: 100%; }
  .btn[disabled] { background: #e3e1dc; color: #9c9a95; box-shadow: none; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { height: 40px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--sub); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); }
  .count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--amber); color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .search { display: flex; align-items: center; gap: 10px; height: 48px; border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); padding: 0 14px; color: var(--sub); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--ink); height: 100%; user-select: text; -webkit-user-select: text; }
  .search:focus-within { box-shadow: inset 0 0 0 2px var(--amber); }
  .list { border-radius: 20px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .li { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 68px; text-align: left; border-bottom: 1px solid var(--line); transition: background 0.12s; }
  .li:last-child { border-bottom: 0; }
  .li:active { background: var(--fill); }
  .li .main { flex: 1; min-width: 0; } .li .main b { display: block; font-size: 16px; } .li .main .sub { display: block; }
  .av { width: 44px; height: 44px; border-radius: 99px; background: var(--amber-soft); color: var(--amber-ink); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sec-t { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--sub); margin: 18px 4px 8px; }
  .empty { height: 100%; min-height: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 24px; }
  .empty .ico { width: 88px; height: 88px; border-radius: 28px; background: var(--amber-soft); color: var(--amber-2); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
  .empty h2 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  .empty p { margin: 0 0 8px; color: var(--sub); max-width: 340px; line-height: 1.5; }
  .stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 12px; height: 40px; }
  .stepper button { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
  .stepper button:active { background: #e4e1da; }
  .stepper b { min-width: 22px; text-align: center; }
  .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--sub); }
  .kv.total { color: var(--ink); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .kv.total .amt { color: var(--amber-2); }

  /* ---------- dashboard ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .kpi { padding: 18px; }
  .kpi .l { font-size: 13px; color: var(--sub); font-weight: 600; }
  .kpi .v { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; }
  .kpi .d { font-size: 13px; font-weight: 600; color: var(--green); margin-top: 2px; }
  .start { display: flex; align-items: center; gap: 18px; padding: 18px 20px; margin-top: 16px; border-radius: 22px; background: linear-gradient(120deg, var(--amber), var(--amber-2)); color: #fff; width: 100%; text-align: left; box-shadow: 0 16px 30px -18px rgb(180 83 9 / 0.9); }
  .start:active { transform: scale(0.99); }
  .start .ic { width: 56px; height: 56px; border-radius: 18px; background: rgb(255 255 255 / 0.2); display: flex; align-items: center; justify-content: center; }
  .start b { font-size: 20px; display: block; } .start span { opacity: 0.9; font-size: 14px; }
  .dash-cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-top: 4px; }
  .badge { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--green-soft); color: var(--green); }

  /* ---------- client ---------- */
  .client-wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
  mark { background: #ffe9a8; color: inherit; border-radius: 3px; padding: 0 1px; }

  /* ---------- commande ---------- */
  .cmd { display: grid; grid-template-columns: 300px minmax(0, 1fr) 128px; gap: 14px; height: 100%; }
  .cmd-content { padding-top: 4px; padding-bottom: 16px; overflow: hidden; }
  .order { display: flex; flex-direction: column; min-height: 0; }
  .order-h { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .order-h b { font-size: 18px; }
  .order-lines { flex: 1; overflow: auto; padding: 4px 14px; }
  .oline { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .oline .nm { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .oline .tot { font-weight: 700; text-align: right; }
  .oline .trash { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--sub); }
  .oline .trash:active { background: var(--red-soft); color: var(--red); }
  .order-f { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
  .disc { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; color: var(--sub); }
  .disc input { width: 110px; height: 44px; border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1px var(--line); text-align: right; padding: 0 12px; font-size: 16px; background: var(--card); color: var(--ink); user-select: text; -webkit-user-select: text; }
  .disc input:focus { outline: 0; box-shadow: inset 0 0 0 2px var(--amber); }
  .catalog { display: flex; flex-direction: column; min-height: 0; }
  .cat-h { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .cat-h b { font-size: 18px; white-space: nowrap; }
  .cat-h .search { height: 44px; flex: 1; box-shadow: none; background: var(--fill); }
  .grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); align-content: start; gap: 12px; padding: 16px; }
  .tile { position: relative; text-align: left; background: var(--card); border-radius: 18px; padding: 8px 8px 12px; box-shadow: 0 1px 2px rgb(0 0 0 / 0.05), inset 0 0 0 1px var(--line); transition: transform 0.08s, box-shadow 0.15s; }
  .tile:active { transform: scale(0.96); }
  .tile.on { box-shadow: inset 0 0 0 2px var(--amber), 0 8px 18px -12px rgb(217 119 6 / 0.8); }
  .tile.quote { background: #fcfbf8; box-shadow: inset 0 0 0 1.5px #d9d5cc; }
  .tile .nm { font-size: 13px; font-weight: 600; margin: 8px 4px 2px; line-height: 1.25; min-height: 33px; }
  .tile .pr { font-size: 15px; font-weight: 700; margin: 0 4px; color: var(--amber-2); }
  .tile .pr.dev { color: var(--sub); font-size: 13px; }
  .tile .q { position: absolute; top: -6px; right: -6px; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 99px; background: var(--amber); color: #fff; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--bg); z-index: 1; }
  .tile.pop { animation: pop 0.28s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .cats { border-radius: 20px; background: linear-gradient(180deg, var(--amber), var(--amber-2)); padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
  .cats .cap { color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; padding: 4px 0 6px; }
  .cat { position: relative; border-radius: 14px; padding: 10px 6px; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; color: #fff; font-size: 11px; font-weight: 600; line-height: 1.2; background: rgb(255 255 255 / 0.12); }
  .cat.on { background: #fff; color: var(--amber-3); font-weight: 800; }
  .cat .count { position: absolute; top: -4px; right: -4px; background: #fff; color: var(--amber-3); box-shadow: 0 0 0 2px var(--amber); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 99px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; font-size: 14px; }
  .chip.on { background: var(--ink); color: #fff; box-shadow: none; }
  .p-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding-bottom: 90px; }
  .p-grid .tile { border-radius: 16px; padding: 6px 6px 10px; }
  .p-grid .tile .nm { font-size: 12.5px; min-height: 31px; }
  .p-grid .tile .q { min-width: 24px; height: 24px; font-size: 12px; }
  .cartbar { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(82px + env(safe-area-inset-bottom, 0px)); height: 60px; border-radius: 18px; background: var(--amber); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-shadow: 0 16px 30px -14px rgb(180 83 9 / 0.95); z-index: 4; text-align: left; }
  .framed .cartbar { bottom: 102px; }
  .cartbar .n { min-width: 34px; height: 34px; border-radius: 11px; background: rgb(255 255 255 / 0.22); display: flex; align-items: center; justify-content: center; font-weight: 800; }
  .cartbar .t { flex: 1; font-weight: 700; } .cartbar b { font-size: 18px; }
  .cartbar.empty { background: #fff; color: var(--sub); box-shadow: 0 10px 24px -14px rgb(0 0 0 / 0.4), inset 0 0 0 1px var(--line); }

  /* ---------- product pictures (CSS stand-ins for the photos of Gestion → Tarifs) ---------- */
  .pic { position: relative; display: block; overflow: hidden; aspect-ratio: 4 / 3; border-radius: 12px; background: linear-gradient(160deg, #f3f0ea, #e3ded4); }
  .pic::before, .pic::after { content: ""; position: absolute; }
  .pic.ph { display: flex; align-items: center; justify-content: center; color: #a7a39a; background: var(--fill); }
  .pic.carton::before { inset: 26% 22% 14%; border-radius: 2px; background: linear-gradient(90deg, transparent 44%, rgb(240 225 190 / 0.85) 44% 56%, transparent 56%), linear-gradient(180deg, #a77845 0 26%, #c08e57 26%); }
  .pic.carton.s::before { inset: 38% 32% 16%; } .pic.carton.l::before { inset: 18% 16% 10%; }
  .pic.fut-bleu::before, .pic.fut-noir::before { inset: 10% 33%; border-radius: 18% / 8%; background: repeating-linear-gradient(180deg, #2f6bd0 0 24%, #2353a8 24% 28%); }
  .pic.fut-noir::before { background: repeating-linear-gradient(180deg, #3a3b3b 0 24%, #202121 24% 28%); }
  .pic.fridge::before { inset: 8% 34%; border-radius: 4px; border: 1px solid #b9bcb8; background: linear-gradient(180deg, #fbfbfb 0 36%, #b9bcb8 36% 38%, #fbfbfb 38%); }
  .pic.fridge::after { right: 38%; top: 18%; width: 2px; height: 10%; background: #7d817d; }
  .pic.fridge.s::before { inset: 34% 34% 8%; background: #fbfbfb; } .pic.fridge.s::after { top: 44%; }
  .pic.fridge.l::before { inset: 5% 29%; }
  .pic.us::before { inset: 8% 22%; border-radius: 4px; border: 1px solid #a9ada9; background: linear-gradient(90deg, #e3e7ec 0 49%, #9ea29e 49% 51%, #e3e7ec 51%); }
  .pic.freezer::before { inset: 40% 22% 12%; border-radius: 4px; border: 1px solid #b9bcb8; background: linear-gradient(180deg, #dcdedb 0 16%, #fbfbfb 16%); }
  .pic.freezer.m::before { inset: 34% 16% 12%; } .pic.freezer.l::before { inset: 28% 10% 10%; }
  .pic.micro::before { inset: 30% 18%; border-radius: 4px; border: 3px solid #d9dbd8; background: linear-gradient(90deg, #2c2f2e 0 64%, #d9dbd8 64%); }
  .pic.washer::before { inset: 14% 27%; border-radius: 6px; border: 1px solid #b9bcb8; background: radial-gradient(circle at 50% 60%, #4a5866 0 24%, #c2c5c1 24% 29%, #fbfbfb 29%); }
  .pic.tv::before { inset: 22% 14% 26%; border-radius: 3px; background: linear-gradient(160deg, #2a2d33, #121418); border: 2px solid #3a3d42; }
  .pic.tv::after { left: 44%; right: 44%; bottom: 14%; height: 12%; background: #3a3d42; }
  .pic.valise::before { inset: 22% 30% 10%; border-radius: 8px; background: linear-gradient(90deg, #26374d 0 30%, #1e2c3e 30% 34%, #26374d 34% 66%, #1e2c3e 66% 70%, #26374d 70%); }
  .pic.valise::after { left: 42%; right: 42%; top: 12%; height: 12%; border: 3px solid #26374d; border-bottom: 0; border-radius: 6px 6px 0 0; }

  /* ---------- encaissement ---------- */
  .pay { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; max-width: 1120px; margin: 0 auto; }

};
const priceLabel = (p) => (p.mode === "Q" ? "Sur devis" : p.mode === "D" ? `dès ${euro(p.price)}` : euro(p.price));

/* ======================= toasts ======================= */
let toasts = [];
function toast(msg) {
  const id = Math.random();
  toasts.push({ id, msg });
  renderToasts();
  setTimeout(() => { toasts = toasts.filter((t) => t.id !== id); renderToasts(); }, 2600);
}
function renderToasts() {
  const el = document.querySelector(".toasts");
  if (el) el.innerHTML = toasts.map((t) => `<div class="toast">${ic("check", "ok")}<span>${t.msg}</span></div>`).join("");
}

    return `<div class="empty enter"><div class="ico">${ic("box", "i40")}</div><h2>Commande vide</h2><p>Ajoutez des produits à la commande.</p><button class="btn p xl" data-act="go" data-v="commande">Retour à la commande</button></div>`;
  return `<div class="empty enter"><div class="ico">${ic("card", "i40")}</div><h2>Paiement non validé</h2><p>Encaissez la commande avant d'imprimer le bordereau.</p><button class="btn p xl" data-act="go" data-v="encaissement">Aller à l'encaissement</button></div>`;
}

function clientRow(c, q) {

function vClient() {
  const list = allClients();

function clientResults(q, hits) {

function catQty(key) { return S.items.filter((l) => l.cat === key).reduce((s, l) => s + l.qty, 0); }

    ? `<div class="change ok"><span>Monnaie à rendre</span><b class="num">${euro(recu - total())}</b></div>`

  if (S.sheet === "container")
    return wrap(`<div class="sh-h"><span></span><b>Conteneur de destination</b><button class="r" data-act="close">OK</button></div>`,
      `<div class="list">${CONTAINERS.map((c) => `<button class="li" data-act="pickContainer" data-v="${c.id}"><span class="av" style="background:#e9f3ec;color:var(--green)">${ic("container", "i18")}</span><span class="main"><b>${c.id} — ${c.name}</b><span class="sub">${c.dep}</span></span>${S.container === c.id ? ic("check") : ""}</button>`).join("")}</div>`);
  if (S.sheet === "cart")
    return wrap(`<div class="sh-h"><span></span><b>Panier · ${qtyCount()} colis</b><button class="r" data-act="close">Fermer</button></div>`,
      `<div class="sub" style="margin-top:-4px">${esc(fullName(S.client))}</div><div id="lines">${orderLines()}</div>${orderFoot()}`, false);
  if (S.sheet.startsWith("quote:")) {
    const p = P.find((x) => x.id === S.sheet.slice(6));
    return wrap(`<div class="sh-h"><button class="l" data-act="close">Annuler</button><b>${esc(p.name)}</b><button class="r" data-act="addQuote" data-v="${p.id}">Ajouter</button></div>`,
      `<p class="sub" style="margin:0;font-size:14px">Article sur devis : saisissez le prix convenu avec le client.</p>
       <div class="field"><label for="qPrice">Prix (€) *</label><input id="qPrice" inputmode="numeric" placeholder="Ex : 350"></div>
       <div class="field"><label for="qDesc">Description (optionnel)</label><input id="qDesc" placeholder="${esc(p.name)}"></div>
       <button class="btn p xl block" data-act="addQuote" data-v="${p.id}">Ajouter à la commande</button>`);
  }
  if (S.sheet === "newClient")
    return wrap(`<div class="sh-h"><button class="l" data-act="close">Annuler</button><b>Nouveau client</b><button class="r" data-act="createClient">Créer</button></div>`,
      `<div class="seg"><button class="on">Expéditeur</button><button>Destinataire</button></div>
       <div class="two"><div class="field"><label for="nFirst">Prénom *</label><input id="nFirst" autocomplete="off"></div><div class="field"><label for="nLast">Nom *</label><input id="nLast" autocomplete="off"></div></div>
       <div class="field"><label for="nPhone">Téléphone *</label><input id="nPhone" inputmode="tel" placeholder="+33 6 …"></div>
       <div class="two"><div class="field"><label for="nCity">Ville *</label><input id="nCity" value="Paris"></div><div class="field"><label>Pays *</label><input value="France" readonly></div></div>
       <p class="sub" id="nErr" style="color:var(--red);margin:0"></p>
       <button class="btn p xl block" data-act="createClient">Créer et sélectionner</button>`);
  if (S.sheet === "about")
    return wrap(`<div class="sh-h"><span></span><b>À propos de cette maquette</b><button class="r" data-act="close">Fermer</button></div>`, aboutHTML());
  return "";
}
function aboutHTML() {
  return `<div class="about" style="display:grid;gap:10px">
    <p><b>Votre flux, inchangé :</b> Dashboard → Client → Commande → Encaissement → Impression → Terminer, dans le même ordre, avec les mêmes écrans et les mêmes boutons. Seule la façon de les tenir en main change.</p>
    <h4>Ce qui fait « application »</h4>
    <ul><li>Ouverte depuis l'icône « Caisse » de l'écran d'accueil : plein écran, sans barre d'adresse.</li>
    <li>Tablette : la colonne orange des étapes devient une barre d'application, avec une coche sur chaque étape faite. Téléphone : les six étapes en barre du bas.</li>
    <li>Gros boutons (44 px et plus), réponse immédiate au toucher, petite vibration quand un colis est ajouté, feuilles qui glissent depuis le bas.</li>
    <li>Pavé numérique pour le montant reçu, à la place du clavier du téléphone.</li>
    <li>La vente en cours est gardée sur l'appareil : rechargez cette page, elle est toujours là.</li>
    <li>Pas de zoom au double toucher, pas de page qui rebondit, pas de texte sélectionné par un appui long.</li></ul>
    <h4>Corrigé au passage</h4>
    <ul><li>Revenir sur Impression ne recrée plus l'expédition (aujourd'hui, elle est créée une deuxième fois).</li>
    <li>Impression demande un paiement validé.</li>
    <li>La recherche montre tous les clients trouvés, et un client créé est sélectionné tout de suite.</li>
    <li>Terminer affiche des euros (aujourd'hui des FCFA) ; le bordereau écrit « Espèces » au lieu de « ESPECES ».</li>
    <li>Le bouton « Terminer » d'Impression mène à l'écran Terminer au lieu de le sauter.</li></ul>
    <h4>Voir</h4>
    <div class="seg"><button class="${S.view === "auto" ? "on" : ""}" data-act="view" data-v="auto">Plein écran</button><button class="${S.view === "phone" ? "on" : ""}" data-act="view" data-v="phone">Téléphone</button></div>
    <button class="btn out block" data-act="reset">Recommencer la démonstration</button>
    <p class="sub">Maquette : les clients, conteneurs et ventes sont des exemples. Rien n'est envoyé.</p>
  </div>`;
}

/* ======================= shell ======================= */
function containerChip(compact) {
  const c = container();
  return `<button class="ctn" data-act="sheet" data-v="container">${ic("container")}<span style="min-width:0">${compact ? "" : `<span class="lbl">Conteneur de destination</span>`}<b>${c.id} — ${c.name}</b></span>${ic("chev-d", "i18")}</button>`;
}
function view() {
  return { dashboard: vDashboard, client: vClient, commande: vCommande, encaissement: vEncaissement, impression: vImpression, terminer: vTerminer }[S.step]();
}
function stepTitle() {
  const s = STEPS.find((x) => x.id === S.step);
  return s.title;
}
function tabletShell() {
  const lede = S.step === "dashboard" ? "Gestion des encaissements et paiements · mercredi 22 octobre" : S.step === "client" ? "Recherchez un client existant ou créez-en un nouveau" : S.client ? fullName(S.client) : "";
  return `<div class="t-shell">
    <nav class="rail">
      <div class="logo">NAANGE<br>ENVOI</div>
      ${STEPS.map((s) => `<button class="step ${S.step === s.id ? "on" : ""}" data-act="go" data-v="${s.id}">${done[s.id]() ? `<span class="done">${ic("check", "i16")}</span>` : ""}${ic(s.icon)}${s.label}</button>`).join("")}
      <span class="grow"></span>
      ${S.client ? `<div class="rail-client"><b>${esc(S.client.first)}</b>${esc(S.client.phone.slice(0, 9))}…<button data-act="go" data-v="client">Changer</button></div>` : ""}
      <button class="hub" data-act="hub">${ic("home", "i18")}Hub</button>
    </nav>
    <div class="t-main">
      <header class="topbar"><div style="min-width:0"><h1>${stepTitle()}</h1>${lede ? `<p class="lede">${esc(lede)}</p>` : ""}</div>${containerChip(false)}</header>
      <main class="content ${S.step === "commande" && S.client ? "cmd-content" : ""}" id="content">${view()}</main>
    </div>
  </div>`;
}
function phoneShell() {
  const showCart = S.step === "commande" && S.client;
  return `<div class="p-shell">
    <header class="p-top"><div class="row1"><h1>${S.step === "client" ? "Client" : stepTitle()}</h1><div style="display:flex;gap:8px;align-items:center"><button class="demo-pill inline" data-act="sheet" data-v="about" aria-label="À propos de la maquette">${ic("info", "i18")}</button>${S.client ? `<button class="avatar-btn" data-act="go" data-v="client" aria-label="Changer de client">${initials(S.client)}</button>` : ""}</div></div>${containerChip(true)}</header>
    <main class="p-content" id="content">${view()}</main>
    ${showCart ? `<button class="cartbar ${S.items.length ? "" : "empty"}" data-act="sheet" data-v="cart"><span class="n">${qtyCount()}</span><span class="t">${S.items.length ? "Voir le panier" : "Panier vide"}</span><b class="num">${euro(total())}</b></button>` : ""}
    <nav class="p-nav">${STEPS.map((s) => `<button class="${S.step === s.id ? "on" : ""}" data-act="go" data-v="${s.id}"><span class="ic">${ic(s.icon)}</span>${s.short}${done[s.id]() ? `<span class="done">${ic("check", "i16")}</span>` : ""}</button>`).join("")}</nav>
  </div>`;
}

/* ======================= render ======================= */
const host = document.getElementById("host");
function render() {
  const active = document.activeElement;
  const focusId = active && active.id && active.tagName !== "BUTTON" ? active.id : null;
  const caret = focusId && active.selectionStart != null ? active.selectionStart : null;
  const scroll = document.getElementById("content")?.scrollTop || 0;
  const framed = S.view === "phone" && window.innerWidth >= 820;
  host.className = framed ? "framed" : "";
  const app = `<div class="app ${isPhone() ? "is-phone" : ""}">${isPhone() ? phoneShell() : tabletShell()}${sheetHTML()}<div class="toasts"></div>${isPhone() ? "" : `<button class="demo-pill" data-act="sheet" data-v="about">${ic("info", "i16")}Maquette</button>`}</div>`;
  host.innerHTML = framed ? `<div class="device">${app}</div>` : app;
  if (framed) fitDevice();
  renderToasts();
  const c = document.getElementById("content");
  if (c && !stepChanged) c.scrollTop = scroll;
  stepChanged = false;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch {} } }
  S.lastAdded = null;
  save();
}
let stepChanged = false;
function fitDevice() {
  const d = host.querySelector(".device");
  if (!d) return;
  const scale = Math.min(1, (window.innerHeight - 40) / 864, (window.innerWidth - 40) / 410);
  d.style.transform = `scale(${scale})`;
}

/* ======================= actions ======================= */
function go(step) { if (S.step !== step) stepChanged = true; S.step = step; S.sheet = null; render(); }
function startCreate() {
  if (S.creating || S.order) return;
  S.creating = true;
  setTimeout(() => {
    S.creating = false;
    if (S.order) return;
    S.seq += 1;
    S.order = { shp: `SHP2026100${S.seq}`, brd: `BRD20261022${String(S.seq).slice(-3)}` };
    toast(`Expédition créée avec succès · N° ${S.order.shp}`);
    if (S.step === "impression") render(); else save();
  }, 1300);
}
const A = {
  go: (v) => go(v),
  hub: () => toast("Retour au Hub de gestion"),
  sheet: (v) => { S.sheet = v; render(); if (v === "newClient") setTimeout(() => document.getElementById("nFirst")?.focus(), 250); if (v.startsWith?.("quote:")) setTimeout(() => document.getElementById("qPrice")?.focus(), 250); },
  close: () => { S.sheet = null; render(); },
  pickContainer: (v) => { S.container = v; S.sheet = null; toast(`Conteneur ${v} choisi`); render(); },
  clientTab: (v) => { S.clientTab = v; render(); },
  pickClient: (v) => { S.client = allClients().find((c) => c.id === v); vibrate(); toast(`Client sélectionné : ${fullName(S.client)}`); go("commande"); },
  createClient: () => {
    const val = (id) => document.getElementById(id)?.value.trim() || "";
    const first = val("nFirst"), last = val("nLast"), phone = val("nPhone"), city = val("nCity");
    const err = !first ? "Le prénom est requis" : !last ? "Le nom est requis" : !phone ? "Le téléphone est requis" : !city ? "La ville est requise" : "";
    if (err) { document.getElementById("nErr").textContent = err; return; }
    const c = { id: "n" + Date.now(), code: "CLI2026" + String(S.extraClients.length + 51).padStart(4, "0"), first, last, phone, email: "", city, since: "aujourd'hui", rName: "", rPhone: "", rCity: "" };
    S.extraClients = [c, ...S.extraClients]; S.client = c;
    toast("Client créé avec succès"); go("commande");
  },
  cat: (v) => { S.cat = v; S.q = ""; render(); },
  add: (v) => {
    const p = P.find((x) => x.id === v);
    if (p.mode === "Q") { A.sheet("quote:" + v); return; }
    const l = S.items.find((x) => x.pid === v && !x.quote);
    if (l) l.qty += 1; else S.items.push({ id: v, pid: v, name: p.name, price: p.price, qty: 1, cat: p.cat });
    S.paid = false; S.order = null; S.lastAdded = v; vibrate(); render();
  },
  addQuote: (v) => {
    const p = P.find((x) => x.id === v);
    const price = Number((document.getElementById("qPrice")?.value || "").replace(",", "."));
    if (!(price > 0)) { document.getElementById("qPrice")?.focus(); return; }
    const desc = document.getElementById("qDesc")?.value.trim();
    S.items.push({ id: `${v}-q-${Date.now()}`, pid: v, quote: true, name: desc || p.name, price, qty: 1, cat: p.cat });
    S.paid = false; S.order = null; S.sheet = null; vibrate(); render();
  },
  inc: (v) => { const l = S.items.find((x) => x.id === v); l.qty += 1; S.paid = false; S.order = null; render(); },
  dec: (v) => { const l = S.items.find((x) => x.id === v); l.qty -= 1; if (l.qty <= 0) S.items = S.items.filter((x) => x.id !== v); S.paid = false; S.order = null; if (!S.items.length && S.sheet === "cart") S.sheet = null; render(); },
  del: (v) => { S.items = S.items.filter((x) => x.id !== v); S.paid = false; S.order = null; if (!S.items.length && S.sheet === "cart") S.sheet = null; render(); },
  mode: (v) => { S.pay.mode = v; render(); },
  key: (v) => { if (S.pay.recu.length < 6 && !(S.pay.recu === "" && v === "0")) S.pay.recu += v; vibrate(); render(); },
  keyC: () => { S.pay.recu = ""; render(); },
  keyDel: () => { S.pay.recu = S.pay.recu.slice(0, -1); render(); },
  exact: () => { S.pay.recu = String(Math.ceil(total())); render(); },
  pay: () => {
    if (!canValidate() || S.processing) return;
    S.processing = true; render();
    setTimeout(() => { S.processing = false; S.paid = true; S.pay.paidAt = Date.now(); go("impression"); }, 800);
  },
  print: () => toast("PDF ouvert pour impression"),
  pdf: () => toast("PDF téléchargé"),
  finish: () => {
    if (S.paid) { S.sales += 1; S.amount += total(); S.colis += qtyCount(); }
    S.client = null; S.items = []; S.discount = 0; S.pay = { mode: "ESPECES", recu: "", obs: "" }; S.paid = false; S.order = null; S.clientQ = ""; S.q = "";
    toast("Transaction terminée"); render();
    setTimeout(() => go("client"), 1000);
  },
  view: (v) => { S.view = v; S.sheet = null; render(); },
  reset: () => { const v = S.view; S = { ...fresh(), view: v }; toasts = []; render(); },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  A[el.dataset.act]?.(el.dataset.v);
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset?.in;
  if (!k) return;
  const v = e.target.value;
  if (k === "clientQ") { S.clientQ = v; const q = v.trim(); const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); const hits = q ? allClients().filter((c) => norm(`${fullName(c)} ${c.phone} ${c.email}`).includes(norm(q)) || c.phone.replace(/\s/g, "").includes(q.replace(/\s/g, ""))) : []; document.getElementById("clientResults").innerHTML = clientResults(q, hits); save(); }
  if (k === "q") { S.q = v; document.getElementById("tiles").innerHTML = tiles(); save(); }
  if (k === "discount") { const n = Math.max(0, parseInt(v.replace(/\D/g, ""), 10) || 0); S.discount = n; e.target.value = n || ""; document.getElementById("subT").textContent = euro(subtotal()); document.getElementById("totT").textContent = euro(total()); const cb = document.querySelector(".cartbar b"); if (cb) cb.textContent = euro(total()); S.paid = false; S.order = null; save(); }
  if (k === "obs") { S.pay.obs = v; save(); }
});
window.addEventListener("resize", () => { if (S.view === "phone" && window.innerWidth >= 820) fitDevice(); else render(); });
render();
</script>
</body>
</html>
